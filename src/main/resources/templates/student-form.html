
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Student Form</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body class="dashboard-body">

<div class="form-page">

    <div class="form-page-header">

        <div>
            <h1>Student Information</h1>

            <p>
                Add or update student details.
            </p>
        </div>

        <a th:href="@{/students}"
           class="btn-secondary">
            Back to Students
        </a>

    </div>

    <div class="content-card form-card">

        <form th:action="@{/students/save}"
              th:object="${student}"
              method="post">

            <input type="hidden"
                   th:field="*{id}">

            <div class="form-group">

                <label>Student Name</label>

                <input type="text"
                       th:field="*{name}"
                       placeholder="Enter student name">

                <small class="field-error"
                       th:errors="*{name}">
                </small>

            </div>

            <div class="form-group">

                <label>Email Address</label>

                <input type="email"
                       th:field="*{email}"
                       placeholder="Enter email address">

                <small class="field-error"
                       th:errors="*{email}">
                </small>

            </div>

            <div class="form-group">

                <label>Course</label>

                <select th:field="*{course}">

                    <option value="">
                        Select Course
                    </option>

                    <option value="Java">
                        Java
                    </option>

                    <option value="Spring Boot">
                        Spring Boot
                    </option>

                    <option value="React">
                        React
                    </option>

                    <option value="Full Stack Development">
                        Full Stack Development
                    </option>

                </select>

                <small class="field-error"
                       th:errors="*{course}">
                </small>

            </div>

            <button type="submit"
                    class="btn-primary">
                Save Student
            </button>

        </form>

    </div>

</div>

</body>
</html>
